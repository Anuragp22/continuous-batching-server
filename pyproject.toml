[project]
name = "cbserver"
version = "0.1.0"
description = "Continuous-batching inference server (mini-vLLM clone)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "tokenizers==0.20.3",
  "safetensors==0.4.5",
  "sentencepiece==0.2.0",
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sse-starlette==2.1.3",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "structlog==24.4.0",
  "prometheus-client==0.21.0",
  "numpy==1.26.4",
  "click==8.1.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "pytest-timeout==2.3.1",
  "ruff==0.7.4",
  "mypy==1.13.0",
]
bench = [
  "locust==2.32.2",
  "matplotlib==3.9.2",
  "pandas==2.2.3",
  "tqdm==4.67.0",
]
gpu = [
  "flash-attn==2.7.0.post2",
]

[project.scripts]
cbserver = "cbserver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbserver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "gpu: requires CUDA",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
